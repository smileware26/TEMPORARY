<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><title>Create Demo Account | SmileWare</title><style>
:root{--blue:#0a74c0;--blue2:#075c9c;--light:#eaf6ff;--text:#183042;--muted:#6d8190;--line:#dce8ef;--shadow:0 10px 30px rgba(20,80,120,.08)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7fbfe;color:var(--text)}a{text-decoration:none}.page{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(600px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;color:var(--blue)}.logo{width:36px;height:36px;border-radius:12px;background:var(--light);display:grid;place-items:center;font-size:20px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:700}.field input{width:100%;border:1px solid #cfdde6;border-radius:9px;padding:11px 12px}.btn{border:0;background:var(--blue);color:#fff;padding:12px 18px;border-radius:9px;font-weight:700;width:100%}.notice{padding:11px 13px;background:#fff2f2;border:1px solid #f2caca;color:#a83d3d;border-radius:8px;font-size:12px;margin:12px 0}.warning{background:#fff8e8;border:1px solid #f2dfb0;color:#715319;padding:11px;border-radius:9px;font-size:12px;margin:15px 0}.muted{color:var(--muted)}
</style></head><body><main class="page"><section class="card"><div class="brand"><span class="logo">🦷</span>SmileWare</div><h1>Create Demo Patient Account</h1><p class="muted">For the school prototype only. No real patient data.</p><div class="warning">Use fake information only. This account is saved in your current browser.</div><div id="registerNotice"></div><form id="registerForm" autocomplete="off"><div class="field"><label for="regName">Full name</label><input id="regName" maxlength="60" required></div><div class="field"><label for="regEmail">Demo email</label><input id="regEmail" type="email" maxlength="100" placeholder="student@example.test" required></div><div class="field"><label for="regPhone">Demo phone</label><input id="regPhone" maxlength="20" placeholder="09000000000"></div><div class="field"><label for="regPassword">Demo password</label><input id="regPassword" type="password" minlength="8" maxlength="64" autocomplete="new-password" required></div><button class="btn">Create Demo Account</button></form><p style="text-align:center;font-size:12px"><a href="login.html" style="color:var(--blue)">Back to demo login</a></p></section></main><script src="app.js"></script></body></html>
