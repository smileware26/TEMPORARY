<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><title>Staff Demo | SmileWare</title><style>
:root{--blue:#0a74c0;--blue2:#075c9c;--light:#eaf6ff;--text:#183042;--muted:#6d8190;--line:#dce8ef;--card:#fff;--shadow:0 10px 30px rgba(20,80,120,.08)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7fbfe;color:var(--text)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}button{cursor:pointer}.dashboard{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 15px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;color:var(--blue)}.logo{width:36px;height:36px;border-radius:12px;background:var(--light);display:grid;place-items:center;font-size:20px}.side-links{display:grid;gap:5px;margin-top:25px}.side-links a{padding:11px 12px;border-radius:8px;font-size:13px;color:var(--muted)}.side-links a.active,.side-links a:hover{background:#eaf6ff;color:var(--blue);font-weight:700}.dash-main{padding:28px;min-width:0}.dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.btn{border:0;background:var(--blue);color:#fff;padding:12px 18px;border-radius:9px;font-weight:700}.btn.secondary{background:#fff;color:var(--blue);border:1px solid #bcd8e8}.btn.small{padding:8px 12px;font-size:12px}.prototype-warning{background:#fff8e8;border:1px solid #f2dfb0;color:#715319;padding:11px 13px;border-radius:9px;font-size:12px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow)}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:27px;margin-top:7px}.section-card{margin-top:15px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th,.data-table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}.data-table th{color:var(--muted);font-siz
