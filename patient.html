<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><title>Patient Portal | SmileWare</title><style>
:root{--blue:#0a74c0;--blue2:#075c9c;--light:#eaf6ff;--text:#183042;--muted:#6d8190;--line:#dce8ef;--card:#fff;--green:#1d9b63;--shadow:0 10px 30px rgba(20,80,120,.08)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7fbfe;color:var(--text)}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:20px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;color:var(--blue)}.logo{width:36px;height:36px;border-radius:12px;background:var(--light);display:grid;place-items:center;font-size:20px}.topbar .actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;background:var(--blue);color:#fff;padding:12px 18px;border-radius:9px;font-weight:700}.btn:hover{background:var(--blue2)}.btn.secondary{background:#fff;color:var(--blue);border:1px solid #bcd8e8}.btn.small{padding:8px 12px;font-size:12px}.container{max-width:1000px;margin:auto;padding:28px 20px}.muted{color:var(--muted)}.notice{padding:11px 13px;background:#fff8e8;border:1px solid #f2dfb0;color:#715319;border-radius:8px;font-size:12px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center}.section{margin-top:18px}.booking-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.steps{display:flex;align-items:center;margin-bottom:20px}.step{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.step.active{color:var(--blue);font-weight:700}.circle{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e7eef3}.step.active .circle{background:var(--blue);color:#fff}.connector{height:1px;background:var(--line);flex:1;margin:0 12px}.provider-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.provider{border:1px solid var(--line);background:#fff;padding:16px;border-radius:12px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}.provider.selected{border-color:var(--blue);background:#f4fbff}.avatar{width:45px;height:45px;border-radius:50%;background:#dcefff;display:grid;place-items:center;color:var(--blue);font-weight:800}.provider strong,.provider small{display:block}.provider small{margin-top:5px;color:var(--muted);font-size:11px}.check{margin-left:auto;color:var(--blue);font-weight:900}.info-note{margin-top:15px;padding:11px;background:#f4fbff;border:1px solid #d4eaf7;border-radius:8px;font-size:12px;color:#547180}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions-left{display:flex;gap:8px;flex-wrap:wrap}.calendar-head{display:flex;justify-content:space-between;align-items:center}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:15px}.dow{text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:7px}.day{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px}.day.selected{background:var(--blue);color:#fff}.day:disabled{color:#bdc7cd;background:#f4f6f7;cursor:not-allowed}.slot-list{display:grid;gap:10px;margin-top:18px}.slot{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:13px}.badge{background:#eaf6ff;color:var(--blue);padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}.summary{max-width:620px;margin:25px auto}.summary-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.field{display:grid;gap:7px;margin:14px 0}.field textarea{width:100%;border:1px solid #cfdde6;border-radius:9px;padding:11px}.status{padding:5px 8px;border-radius:15px;font-size:10px;font-weight:700;background:#edf2f5;color:#61727d}.status.Confirmed,.status.Paid,.status.Arrived{background:#e7f8ef;color:#187b4f}.status.Pending{background:#fff5dc;color:#9a6815}.status.Cancelled,.status.No-show{background:#fff0f0;color:#a63e3e}.success{text-align:center;padding:25px 0}.success-icon{width:65px;height:65px;border-radius:50%;background:#e6f8ef;color:var(--green);display:grid;place-items:center;font-size:30px;margin:auto}.appointment-top{display:flex;justify-content:space-between;gap:10px}.prototype-warning{margin-top:15px;background:#fff8e8;border:1px solid #f2dfb0;color:#715319;padding:11px;border-radius:8px;font-size:12px}@media(max-width:700px){.provider-grid{grid-template-columns:1fr}.steps{overflow:auto}.step{white-space:nowrap}.connector{min-width:15px}.hero{display:block}.calendar-grid{gap:3px}.day{padding:8px 2px}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="logo">🦷</span>SmileWare</a><div class="actions"><span style="font-size:12px;color:var(--muted);align-self:center">Patient: <strong data-patient-name></strong></span><button class="btn secondary small" data-logout>Logout</button></div></header><main class="container"><div class="prototype-warning"><strong>School prototype:</strong> Demo data is stored in this browser only. Do not enter real patient information.</div><section id="home" class="hero"><div><span style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);font-weight:800">Patient Portal</span><h1>Welcome, <span data-patient-name></span></h1><p class="muted">Manage your demo appointments and create a new booking.</p></div><button class="btn" onclick="startBooking()">Book an Appointment</button></section><section id="booking" class="section" style="display:none"></section><section class="section"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">My Appointments</h2><span id="appointmentCount" class="badge">0 appointments</span></div><div id="patientAppointments" style="display:grid;gap:12px;margin-top:15px"></div></div></section></main><script src="app.js"></script></body></html>
